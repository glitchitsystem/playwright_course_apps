    <main>
      <div class="page-container" style="max-width: 500px; margin: 2rem auto">
        <h2>Your Locale & Timezone</h2>
        <div id="locale-info" style="margin-bottom: 2em"></div>
      </div>
    </main>
    <footer>
      <p>&copy; 2024 Glitch IT System - Locale & Timezone Demo</p>
    </footer>
    <script>
      // Show user's locale and timezone
      const localeInfo = document.getElementById("locale-info");
      const locale = navigator.language || "unknown";
      const timezone =
        Intl.DateTimeFormat().resolvedOptions().timeZone || "unknown";
      localeInfo.innerHTML = `<strong>Locale:</strong> ${locale}<br><strong>Timezone:</strong> ${timezone}`;
    </script>
